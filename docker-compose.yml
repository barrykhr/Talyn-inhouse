# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talyn
    ports:
      - "5432:5432"
    volumes:
      - talyn-db:/var/lib/postgresql/data
volumes:
  talyn-db:
